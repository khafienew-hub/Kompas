<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kompas Pro + Peta</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet CSS & JS (Untuk Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
            color: white;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes custom-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-custom-pulse {
            animation: custom-pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .compass-rose {
            transition: transform 0.1s cubic-bezier(0.165, 0.84, 0.44, 1);
            will-change: transform;
        }

        /* Custom Scrollbar for container */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5); 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #3b82f6; 
            border-radius: 4px;
        }

        /* Leaflet Dark Mode Overlay */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        /* Fix marker color inversion if needed, or keep it to look cool */
        .leaflet-marker-icon {
            filter: invert(100%) hue-rotate(180deg);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- Components ---

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const MapView = ({ lat, lon }) => {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markerRef = useRef(null);

            useEffect(() => {
                if (!lat || !lon || !mapContainerRef.current) return;

                // Initialize map if not already done
                if (!mapInstanceRef.current) {
                    mapInstanceRef.current = L.map(mapContainerRef.current, {
                        zoomControl: false,
                        attributionControl: false
                    }).setView([lat, lon], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                    }).addTo(mapInstanceRef.current);
                } else {
                    // Just update view
                    mapInstanceRef.current.setView([lat, lon]);
                }

                // Handle Marker
                if (!markerRef.current) {
                    // Create a simple circle marker for "Tech" look
                    markerRef.current = L.circleMarker([lat, lon], {
                        radius: 10,
                        fillColor: "#3b82f6",
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(mapInstanceRef.current);
                } else {
                    markerRef.current.setLatLng([lat, lon]);
                }

                // Force resize to fix gray area issues
                setTimeout(() => {
                    if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize();
                }, 200);

            }, [lat, lon]);

            if (!lat) return <div className="w-full h-32 bg-slate-800/50 rounded-2xl flex items-center justify-center animate-pulse"><span className="text-xs text-slate-500">Menunggu GPS...</span></div>;

            return <div ref={mapContainerRef} className="w-full h-40 rounded-2xl overflow-hidden shadow-inner border border-slate-700/50 relative z-0" />;
        };

        const App = () => {
            const [azimuth, setAzimuth] = useState(0);
            const [isSimulating, setIsSimulating] = useState(false);
            const [hasSensor, setHasSensor] = useState(false);
            const [location, setLocation] = useState({ lat: null, lon: null, alt: null });
            const [locationName, setLocationName] = useState("Mencari Lokasi...");
            const [weather, setWeather] = useState({ 
                windSpeed: null, 
                windDir: null, 
                temp: null, 
                humidity: null,
                code: null 
            });
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            // Mapping Weather Code ke Deskripsi BMKG
            const getWeatherDesc = (code) => {
                const codes = {
                    0: "Cerah", 1: "Cerah Berawan", 2: "Cerah Berawan", 3: "Berawan",
                    45: "Kabut", 48: "Kabut Berawan", 51: "Gerimis Ringan", 53: "Gerimis Sedang", 
                    55: "Gerimis Lebat", 61: "Hujan Ringan", 63: "Hujan Sedang", 65: "Hujan Lebat",
                    80: "Hujan Ringan", 81: "Hujan Sedang", 82: "Hujan Lebat", 
                    95: "Hujan Petir", 96: "Hujan Petir & Es", 99: "Hujan Petir Berat"
                };
                return codes[code] || "Berawan";
            };

            const getWeatherIcon = (code) => {
                if ([0, 1].includes(code)) return "sun";
                if ([2, 3].includes(code)) return "cloud-sun";
                if ([45, 48].includes(code)) return "cloud-fog";
                if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "cloud-rain";
                if ([95, 96, 99].includes(code)) return "cloud-lightning";
                return "cloud";
            };

            const getDirectionLabel = (deg) => {
                const directions = ['U', 'TL', 'T', 'TG', 'S', 'BD', 'B', 'BL', 'U'];
                return directions[Math.round(deg / 45)];
            };

            const fetchLocationName = async (lat, lon) => {
                try {
                    // Menggunakan API BigDataCloud (Gratis & Cepat untuk Reverse Geocoding)
                    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);
                    const data = await res.json();
                    
                    // Prioritas nama lokasi: Locality > City > PrincipalSubdivision
                    const locality = data.locality || data.city || "";
                    const region = data.principalSubdivision || data.countryName || "";
                    
                    if (locality) {
                        setLocationName(`${locality}, ${region}`);
                    } else {
                        setLocationName(region);
                    }
                } catch (e) {
                    console.error("Gagal mendapatkan nama lokasi", e);
                    setLocationName("Lokasi Tidak Dikenal");
                }
            };

            const fetchWeatherData = async (lat, lon) => {
                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m`);
                    const data = await response.json();
                    if (data.current) {
                        setWeather({
                            temp: Math.round(data.current.temperature_2m),
                            humidity: data.current.relative_humidity_2m,
                            code: data.current.weather_code,
                            windSpeed: data.current.wind_speed_10m,
                            windDir: data.current.wind_direction_10m
                        });
                    }
                } catch (e) { console.error("Weather error:", e); }
            };

            const handleOrientation = useCallback((event) => {
                let heading = 0;
                if (event.webkitCompassHeading !== undefined) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = 360 - event.alpha;
                }

                if (!isSimulating) {
                    setAzimuth(((heading % 360) + 360) % 360);
                    setHasSensor(true);
                }
            }, [isSimulating]);

            useEffect(() => {
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });

                const eventName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
                window.addEventListener(eventName, handleOrientation, true);
                
                let watchId = null;
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const newLat = position.coords.latitude.toFixed(4);
                            const newLon = position.coords.longitude.toFixed(4);
                            
                            // Only update if moved significantly to save re-renders/fetches
                            setLocation(prev => {
                                if (prev.lat === newLat && prev.lon === newLon) return prev;
                                
                                fetchWeatherData(newLat, newLon);
                                fetchLocationName(newLat, newLon);
                                
                                return {
                                    lat: newLat,
                                    lon: newLon,
                                    alt: position.coords.altitude ? Math.round(position.coords.altitude) : 0
                                };
                            });
                        },
                        (err) => console.warn("GPS Error"),
                        { enableHighAccuracy: true }
                    );
                }

                return () => {
                    window.removeEventListener(eventName, handleOrientation);
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                };
            }, [handleOrientation]);

            useEffect(() => {
                let interval;
                if (isSimulating) {
                    interval = setInterval(() => setAzimuth(prev => (prev + 0.5) % 360), 50);
                    // Mock data for simulation
                    if (!location.lat) {
                         setLocation({ lat: -6.2000, lon: 106.8167, alt: 15 });
                         setLocationName("Jakarta Pusat (Simulasi)");
                         setWeather({ code: 1, temp: 30, humidity: 75, windSpeed: 12, windDir: 45 });
                    }
                }
                return () => clearInterval(interval);
            }, [isSimulating]);

            const requestPermissions = async () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceOrientationEvent.requestPermission();
                        if (response === 'granted') {
                            setHasSensor(true);
                            setIsSimulating(false);
                        }
                    } catch (e) { console.error(e); }
                } else {
                    setIsSimulating(false);
                    setHasSensor(true);
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude, altitude } = pos.coords;
                        setLocation({ lat: latitude.toFixed(4), lon: longitude.toFixed(4), alt: Math.round(altitude || 0) });
                        fetchWeatherData(latitude, longitude);
                        fetchLocationName(latitude, longitude);
                    }
                );
            };

            const displayDegrees = Math.round(azimuth);

            return (
                <div className="flex flex-col h-screen bg-slate-950 text-white overflow-hidden font-sans">
                    
                    {/* --- Header --- */}
                    <header className="px-6 py-4 flex justify-between items-center bg-slate-900/80 backdrop-blur-md border-b border-white/5 z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(37,99,235,0.4)] border border-blue-400/30">
                                <Icon name="compass" size={20} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight leading-none">KOMPAS PRO</h1>
                                <div className="flex items-center gap-1.5 mt-1">
                                    <span className={`w-1.5 h-1.5 rounded-full ${hasSensor || isSimulating ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                                    <p className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">
                                        {isSimulating ? "MODE SIMULASI" : (hasSensor ? "SENSOR AKTIF" : "NO SENSOR")}
                                    </p>
                                </div>
                            </div>
                        </div>
                        {deferredPrompt && (
                            <button onClick={() => deferredPrompt.prompt()} className="bg-blue-600/20 text-blue-400 border border-blue-500/50 text-[10px] px-3 py-1.5 rounded-full font-bold hover:bg-blue-600 hover:text-white transition-all">
                                INSTALL APP
                            </button>
                        )}
                    </header>

                    {/* --- Scrollable Content --- */}
                    <div className="flex-1 overflow-y-auto custom-scroll relative">
                        
                        {/* 1. Compass Section */}
                        <div className="flex flex-col items-center justify-center pt-8 pb-4 relative z-10">
                            <div className="mb-6 text-center">
                                <div className="text-6xl font-black tabular-nums tracking-tighter drop-shadow-2xl">
                                    {displayDegrees}°
                                </div>
                                <div className="text-xl font-bold text-blue-400 tracking-[0.4em] mt-1 uppercase">
                                    {getDirectionLabel(displayDegrees)}
                                </div>
                            </div>

                            <div className="relative w-64 h-64 md:w-72 md:h-72 my-2">
                                <div className="absolute inset-0 rounded-full border border-slate-800 border-dashed opacity-50"></div>
                                {/* Outer Ring */}
                                <div className="absolute inset-2 rounded-full border-2 border-slate-800/80"></div>
                                
                                {/* Rotating Compass */}
                                <div className="compass-rose absolute inset-0 flex items-center justify-center" style={{ transform: `rotate(${-azimuth}deg)` }}>
                                    <div className="absolute top-3 font-black text-red-500 text-lg drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]">U</div>
                                    <div className="absolute bottom-3 font-bold text-slate-500 text-lg">S</div>
                                    <div className="absolute right-3 font-bold text-slate-500 text-lg">T</div>
                                    <div className="absolute left-3 font-bold text-slate-500 text-lg">B</div>

                                    {/* Ticks */}
                                    {[...Array(72)].map((_, i) => (
                                        <div key={i} 
                                            className={`absolute left-1/2 top-0 origin-[0_128px] md:origin-[0_144px] w-0.5 ${i % 9 === 0 ? 'h-5 bg-slate-300' : 'h-2 bg-slate-700/60'}`} 
                                            style={{ transform: `rotate(${i * 5}deg)` }}>
                                        </div>
                                    ))}
                                </div>

                                {/* Static Indicators */}
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1 z-20">
                                    <div className="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-red-500 drop-shadow-[0_0_10px_red]"></div>
                                </div>
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                    <div className="w-20 h-20 rounded-full border border-blue-500/20 bg-blue-500/5 backdrop-blur-sm z-10 flex items-center justify-center">
                                         <div className="w-1.5 h-1.5 bg-blue-400 rounded-full shadow-[0_0_10px_#60a5fa]"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 2. Info Panels */}
                        <div className="px-6 pb-24 flex flex-col gap-3 max-w-md mx-auto">
                            
                            {/* Weather & Location Card */}
                            <div className="bg-gradient-to-br from-slate-900 to-slate-800 border border-white/5 rounded-3xl p-5 shadow-2xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                    <Icon name={getWeatherIcon(weather.code)} size={80} />
                                </div>

                                {/* Location Name Header */}
                                <div className="flex items-start gap-3 mb-4 relative z-10">
                                    <div className="p-2.5 bg-blue-600/20 rounded-2xl text-blue-400">
                                        <Icon name="map-pin" size={20} />
                                    </div>
                                    <div className="flex-1">
                                        <p className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-0.5">Lokasi Saat Ini</p>
                                        <h2 className="text-lg font-bold leading-tight text-white pr-2">
                                            {locationName}
                                        </h2>
                                    </div>
                                </div>

                                <div className="h-px bg-white/10 w-full mb-4"></div>

                                {/* Weather Grid */}
                                <div className="grid grid-cols-2 gap-4 relative z-10">
                                    <div>
                                        <p className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Cuaca BMKG</p>
                                        <div className="flex items-center gap-2">
                                            <Icon name={getWeatherIcon(weather.code)} size={18} className="text-blue-300" />
                                            <span className="font-bold text-sm">{weather.code !== null ? getWeatherDesc(weather.code) : "..."}</span>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Suhu</p>
                                        <div className="flex items-end justify-end gap-1">
                                            <span className="text-2xl font-black leading-none">{weather.temp ?? "--"}</span>
                                            <span className="text-xs font-bold text-blue-400 mb-1">°C</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Coordinates & Map Container */}
                            <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-1 backdrop-blur-xl shadow-lg">
                                {/* Small stats row */}
                                <div className="grid grid-cols-3 gap-2 p-4 pb-2">
                                    <div className="text-center">
                                        <div className="text-[9px] uppercase text-slate-500 font-bold mb-1">Lat</div>
                                        <div className="font-mono text-xs font-bold">{location.lat || "-"}</div>
                                    </div>
                                    <div className="text-center border-l border-r border-slate-800">
                                        <div className="text-[9px] uppercase text-slate-500 font-bold mb-1">Lon</div>
                                        <div className="font-mono text-xs font-bold">{location.lon || "-"}</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-[9px] uppercase text-slate-500 font-bold mb-1">Alt</div>
                                        <div className="font-mono text-xs font-bold text-emerald-400">{location.alt ? location.alt + 'm' : '-'}</div>
                                    </div>
                                </div>
                                
                                {/* MAP COMPONENT */}
                                <div className="p-1">
                                    <MapView lat={location.lat} lon={location.lon} />
                                </div>
                            </div>
                            
                            {/* Toggle Sim Button */}
                            <button 
                                onClick={() => { setIsSimulating(!isSimulating); if(!isSimulating) setHasSensor(false); }}
                                className="mt-4 text-[10px] font-mono text-slate-600 uppercase tracking-[0.2em] text-center hover:text-blue-400 transition-colors"
                            >
                                {isSimulating ? "Stop Simulasi" : (hasSensor ? "Sensor Terkalibrasi" : "Ketuk untuk Mode Simulasi")}
                            </button>

                        </div>
                    </div>

                    {/* --- Floating Action Button if permissions needed --- */}
                    {!hasSensor && !isSimulating && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
                            <button onClick={requestPermissions} className="flex items-center gap-2 px-6 py-3 bg-blue-600 rounded-full font-bold text-sm shadow-[0_4px_20px_rgba(37,99,235,0.5)] animate-bounce">
                                <Icon name="satellite" size={16} />
                                <span>AKTIFKAN GPS & SENSOR</span>
                            </button>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
