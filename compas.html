<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kompas Pro Premium</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;500&family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-deep: #020617;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: white;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-tech { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Compass Rotation Smoothing */
        .compass-dial {
            transition: transform 0.15s cubic-bezier(0.1, 0.5, 0.1, 1);
            will-change: transform;
        }

        /* Radial Glow Background */
        .bg-glow {
            background: radial-gradient(circle at center, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.1), transparent);
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [azimuth, setAzimuth] = useState(0);
            const [isSimulating, setIsSimulating] = useState(false);
            const [hasSensor, setHasSensor] = useState(false);
            const [location, setLocation] = useState({ lat: null, lon: null, alt: 0 });
            const [weather, setWeather] = useState({ 
                temp: null, humidity: null, code: null, windSpeed: null, windDir: null 
            });
            const [error, setError] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            // Mapping Weather BMKG Style
            const getWeatherMeta = (code) => {
                const map = {
                    0: { desc: "Cerah", icon: "sun", color: "text-yellow-400" },
                    1: { desc: "Cerah Berawan", icon: "cloud-sun", color: "text-blue-200" },
                    2: { desc: "Cerah Berawan", icon: "cloud-sun", color: "text-blue-200" },
                    3: { desc: "Berawan", icon: "cloud", color: "text-slate-400" },
                    61: { desc: "Hujan Ringan", icon: "cloud-rain", color: "text-blue-400" },
                    95: { desc: "Hujan Petir", icon: "cloud-lightning", color: "text-purple-400" }
                };
                return map[code] || { desc: "Berawan", icon: "cloud", color: "text-slate-300" };
            };

            const getDirLabel = (deg) => {
                const dirs = ['UTARA', 'TIMUR LAUT', 'TIMUR', 'TENGGARA', 'SELATAN', 'BARAT DAYA', 'BARAT', 'BARAT LAUT', 'UTARA'];
                return dirs[Math.round(deg / 45)];
            };

            const fetchWeather = async (lat, lon) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m`);
                    const data = await res.json();
                    if (data.current) {
                        setWeather({
                            temp: Math.round(data.current.temperature_2m),
                            humidity: data.current.relative_humidity_2m,
                            code: data.current.weather_code,
                            windSpeed: data.current.wind_speed_10m,
                            windDir: data.current.wind_direction_10m
                        });
                    }
                } catch (e) { console.error(e); }
            };

            const handleOrientation = useCallback((event) => {
                if (isSimulating) return;
                let heading = 0;
                if (event.webkitCompassHeading !== undefined) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = 360 - event.alpha;
                }
                setAzimuth(((heading % 360) + 360) % 360);
                setHasSensor(true);
            }, [isSimulating]);

            useEffect(() => {
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
                window.addEventListener('beforeinstallprompt', e => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });

                const eventName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
                window.addEventListener(eventName, handleOrientation, true);
                
                let watchId = null;
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        pos => {
                            const { latitude, longitude, altitude } = pos.coords;
                            setLocation({ lat: latitude.toFixed(4), lon: longitude.toFixed(4), alt: Math.round(altitude || 0) });
                            fetchWeather(latitude, longitude);
                        },
                        () => setError("Aktifkan GPS"),
                        { enableHighAccuracy: true }
                    );
                }
                return () => {
                    window.removeEventListener(eventName, handleOrientation);
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                };
            }, [handleOrientation]);

            // Simulation Fallback
            useEffect(() => {
                let interval;
                if (isSimulating) {
                    interval = setInterval(() => setAzimuth(p => (p + 0.5) % 360), 50);
                }
                return () => clearInterval(interval);
            }, [isSimulating]);

            const displayDegrees = Math.round(azimuth);
            const weatherMeta = getWeatherMeta(weather.code);

            return (
                <div className="flex flex-col h-screen bg-glow relative select-none">
                    <div className="scanline"></div>

                    {/* Navbar */}
                    <header className="px-6 pt-10 pb-4 flex justify-between items-end z-50">
                        <div>
                            <h1 className="text-2xl font-tech font-black tracking-tighter text-cyan-500">AXIS-PRO</h1>
                            <div className="flex items-center gap-2">
                                <span className={`w-1.5 h-1.5 rounded-full ${hasSensor ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                                <p className="text-[10px] font-mono text-slate-400 uppercase tracking-widest">
                                    {isSimulating ? "Simulated Signal" : (hasSensor ? "Telemetry: Online" : "Telemetry: Offline")}
                                </p>
                            </div>
                        </div>
                        {deferredPrompt && (
                            <button onClick={() => deferredPrompt.prompt()} className="glass px-4 py-1.5 rounded-full text-[10px] font-bold text-cyan-400 border border-cyan-500/30">
                                INSTALL APP
                            </button>
                        )}
                    </header>

                    {/* Main HUD */}
                    <main className="flex-1 flex flex-col items-center justify-center relative">
                        
                        {/* Digital Heading */}
                        <div className="text-center mb-6 z-10">
                            <div className="relative inline-block">
                                <span className="text-8xl font-tech font-black tracking-tighter tabular-nums text-white drop-shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                                    {displayDegrees.toString().padStart(3, '0')}
                                </span>
                                <span className="absolute -right-6 top-2 text-2xl font-tech text-cyan-500">°</span>
                            </div>
                            <p className="text-xl font-tech text-cyan-400/80 tracking-[0.4em] mt-2 h-8">
                                {getDirLabel(displayDegrees)}
                            </p>
                        </div>

                        {/* Professional Compass Dial */}
                        <div className="relative w-80 h-80 md:w-96 md:h-96 flex items-center justify-center">
                            {/* Static Outer Ring */}
                            <div className="absolute inset-0 rounded-full border-2 border-slate-800/50 shadow-[inset_0_0_40px_rgba(0,0,0,0.5)]"></div>
                            <div className="absolute inset-4 rounded-full border border-slate-700/30"></div>
                            
                            {/* Rotating Part */}
                            <div className="compass-dial absolute inset-0" style={{ transform: `rotate(${-azimuth}deg)` }}>
                                {/* Degree Ticks */}
                                {[...Array(72)].map((_, i) => (
                                    <div key={i} className="absolute left-1/2 top-0 origin-[0_160px] md:origin-[0_192px] flex flex-col items-center" style={{ transform: `rotate(${i * 5}deg)` }}>
                                        <div className={`w-[1px] ${i % 9 === 0 ? 'h-5 bg-cyan-500' : (i % 3 === 0 ? 'h-3 bg-slate-500' : 'h-1.5 bg-slate-700')}`}></div>
                                        {i % 9 === 0 && (
                                            <span className="text-[9px] font-mono text-slate-500 mt-1">{i * 5}</span>
                                        )}
                                    </div>
                                ))}

                                {/* Cardinal Letters */}
                                <div className="absolute top-8 left-1/2 -translate-x-1/2 font-tech font-black text-3xl text-red-500 drop-shadow-[0_0_10px_rgba(239,68,68,0.5)]">U</div>
                                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 font-tech font-black text-2xl text-slate-400">S</div>
                                <div className="absolute right-8 top-1/2 -translate-y-1/2 font-tech font-black text-2xl text-slate-400">T</div>
                                <div className="absolute left-8 top-1/2 -translate-y-1/2 font-tech font-black text-2xl text-slate-400">B</div>
                            </div>

                            {/* HUD Static Lines */}
                            <div className="absolute inset-0 pointer-events-none">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[2px] h-10 bg-red-500 z-30 shadow-[0_0_15px_rgba(239,68,68,0.5)]"></div>
                                <div className="absolute inset-0 rounded-full border-[0.5px] border-cyan-500/10 scale-[1.05]"></div>
                            </div>

                            {/* Center Core */}
                            <div className="w-12 h-12 rounded-full glass border border-cyan-500/30 z-40 flex items-center justify-center">
                                <div className="w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                            </div>
                        </div>

                        {/* Weather & Environment Dashboard */}
                        <div className="mt-10 w-full px-6 grid grid-cols-2 gap-3 max-w-md">
                            {/* Weather Card */}
                            <div className="glass rounded-3xl p-4 col-span-2 flex items-center justify-between border-l-4 border-l-cyan-500">
                                <div className="flex items-center gap-4">
                                    <div className={`p-3 rounded-2xl bg-slate-800/50 ${weatherMeta.color}`}>
                                        <Icon name={weatherMeta.icon} size={28} />
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-black text-cyan-500 tracking-widest uppercase">Kondisi BMKG</p>
                                        <p className="text-lg font-bold leading-tight">{weatherMeta.desc}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <p className="text-3xl font-tech">{weather.temp ?? '--'}<span className="text-sm text-cyan-500">°C</span></p>
                                    <p className="text-[9px] font-mono text-slate-500 uppercase">Hum: {weather.humidity ?? '--'}%</p>
                                </div>
                            </div>

                            {/* Altimeter & GPS */}
                            <div className="glass rounded-2xl p-4">
                                <div className="flex items-center gap-2 mb-2">
                                    <Icon name="mountain" size={14} className="text-purple-400" />
                                    <span className="text-[10px] font-bold text-slate-500 uppercase">Elevation</span>
                                </div>
                                <p className="text-xl font-tech">{location.alt}<span className="text-xs ml-1 text-slate-500">M</span></p>
                                <p className="text-[9px] font-mono text-slate-500 mt-1 uppercase">Diatas Laut</p>
                            </div>

                            <div className="glass rounded-2xl p-4">
                                <div className="flex items-center gap-2 mb-2">
                                    <Icon name="wind" size={14} className="text-amber-400" />
                                    <span className="text-[10px] font-bold text-slate-500 uppercase">Wind Spd</span>
                                </div>
                                <p className="text-xl font-tech">{weather.windSpeed ?? '--'}<span className="text-xs ml-1 text-slate-500">KMH</span></p>
                                <p className="text-[9px] font-mono text-slate-500 mt-1 uppercase">Arah: {weather.windDir ? getDirLabel(weather.windDir) : '--'}</p>
                            </div>

                            {/* Coordinate Footer */}
                            <div className="col-span-2 glass rounded-2xl py-2 px-4 flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <Icon name="map" size={12} className="text-cyan-500" />
                                    <span className="text-[10px] font-mono text-slate-400 uppercase tracking-tighter">Pos: {location.lat || '0.0000'}, {location.lon || '0.0000'}</span>
                                </div>
                                <span className="text-[9px] font-mono text-emerald-500 uppercase">GPS High Accuracy</span>
                            </div>
                        </div>
                    </main>

                    {/* Interaction Layer */}
                    <footer className="p-8 flex flex-col items-center gap-4 z-50">
                        {!hasSensor && !isSimulating && (
                            <button onClick={requestPermissions} className="group relative px-10 py-4 bg-cyan-600 rounded-full font-tech font-bold text-sm tracking-widest shadow-[0_0_30px_rgba(6,182,212,0.4)] active:scale-95 transition-all">
                                CALIBRATE SENSORS
                                <div className="absolute inset-0 rounded-full border-2 border-white/20 animate-ping opacity-20"></div>
                            </button>
                        )}
                        
                        <button onClick={() => { setIsSimulating(!isSimulating); if(!isSimulating) setHasSensor(false); }} className="text-[10px] font-mono text-slate-600 uppercase tracking-[0.3em] hover:text-cyan-500 transition-colors">
                            {isSimulating ? "Terminate Simulation" : "Enter Training Mode"}
                        </button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompas Digital Modern</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            margin: 0;
            overflow: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes custom-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-custom-pulse {
            animation: custom-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .compass-rose {
            transition: transform 0.1s linear;
            will-change: transform;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [azimuth, setAzimuth] = useState(0);
            const [isSimulating, setIsSimulating] = useState(false);
            const [hasSensor, setHasSensor] = useState(false);
            const [location, setLocation] = useState({ lat: null, lon: null, alt: null });
            const [weather, setWeather] = useState({ 
                windSpeed: null, 
                windDir: null, 
                temp: null, 
                humidity: null,
                code: null 
            });
            const [error, setError] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            // Mapping Weather Code ke Deskripsi BMKG
            const getWeatherDesc = (code) => {
                const codes = {
                    0: "Cerah",
                    1: "Cerah Berawan", 2: "Cerah Berawan", 3: "Berawan",
                    45: "Kabut", 48: "Kabut Berawan",
                    51: "Gerimis Ringan", 53: "Gerimis Sedang", 55: "Gerimis Lebat",
                    61: "Hujan Ringan", 63: "Hujan Sedang", 65: "Hujan Lebat",
                    80: "Hujan Ringan", 81: "Hujan Sedang", 82: "Hujan Lebat",
                    95: "Hujan Petir", 96: "Hujan Petir & Es", 99: "Hujan Petir Berat"
                };
                return codes[code] || "Berawan";
            };

            const getWeatherIcon = (code) => {
                if ([0, 1].includes(code)) return "sun";
                if ([2, 3].includes(code)) return "cloud-sun";
                if ([45, 48].includes(code)) return "cloud-fog";
                if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "cloud-rain";
                if ([95, 96, 99].includes(code)) return "cloud-lightning";
                return "cloud";
            };

            const getDirectionLabel = (deg) => {
                const directions = ['U', 'TL', 'T', 'TG', 'S', 'BD', 'B', 'BL', 'U'];
                const index = Math.round(deg / 45);
                return directions[index];
            };

            const fetchWeatherData = async (lat, lon) => {
                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m`);
                    const data = await response.json();
                    if (data.current) {
                        setWeather({
                            temp: Math.round(data.current.temperature_2m),
                            humidity: data.current.relative_humidity_2m,
                            code: data.current.weather_code,
                            windSpeed: data.current.wind_speed_10m,
                            windDir: data.current.wind_direction_10m
                        });
                    }
                } catch (e) {
                    console.error("Gagal mengambil data cuaca:", e);
                }
            };

            const handleOrientation = useCallback((event) => {
                let heading = 0;
                if (event.webkitCompassHeading !== undefined) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== null) {
                    heading = 360 - event.alpha;
                }

                if (!isSimulating) {
                    const normalizedHeading = ((heading % 360) + 360) % 360;
                    setAzimuth(normalizedHeading);
                    setHasSensor(true);
                }
            }, [isSimulating]);

            useEffect(() => {
                // Register Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').then(() => {
                        console.log("Service Worker Registered");
                    });
                }

                // Listen for install prompt
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });

                const eventName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
                window.addEventListener(eventName, handleOrientation, true);
                
                let watchId = null;
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const newLat = position.coords.latitude.toFixed(4);
                            const newLon = position.coords.longitude.toFixed(4);
                            
                            setLocation({
                                lat: newLat,
                                lon: newLon,
                                alt: position.coords.altitude ? Math.round(position.coords.altitude) : 0
                            });
                            fetchWeatherData(newLat, newLon);
                        },
                        (err) => console.warn("GPS Error:", err.message),
                        { enableHighAccuracy: true }
                    );
                }

                return () => {
                    window.removeEventListener(eventName, handleOrientation);
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                };
            }, [handleOrientation]);

            useEffect(() => {
                let interval;
                if (isSimulating) {
                    interval = setInterval(() => {
                        setAzimuth(prev => (prev + 0.5) % 360);
                    }, 50);
                }
                return () => clearInterval(interval);
            }, [isSimulating]);

            const handleInstall = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') setDeferredPrompt(null);
                }
            };

            const requestPermissions = async () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceOrientationEvent.requestPermission();
                        if (response === 'granted') {
                            setHasSensor(true);
                            setIsSimulating(false);
                        }
                    } catch (e) {
                        setError("Izin sensor gagal.");
                    }
                } else {
                    setIsSimulating(false);
                    setHasSensor(true);
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherData(pos.coords.latitude, pos.coords.longitude), 
                    (err) => setError("Izin lokasi ditolak.")
                );
            };

            const displayDegrees = Math.round(azimuth);

            return (
                <div className="flex flex-col h-screen bg-slate-950 text-white overflow-hidden">
                    {/* Header */}
                    <div className="p-6 flex justify-between items-center bg-slate-900/50 backdrop-blur-md border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                                <Icon name="compass" size={20} className="text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">KOMPAS PRO</h1>
                                <p className="text-[10px] text-slate-400 font-mono uppercase tracking-[0.3em]">
                                    {isSimulating ? "Mode Simulasi" : "PWA Aktif"}
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            {deferredPrompt && (
                                <button onClick={handleInstall} className="bg-blue-600 text-[10px] px-3 py-1 rounded-full font-bold animate-bounce shadow-lg shadow-blue-500/20">
                                    INSTALL
                                </button>
                            )}
                            <div className="p-2 rounded-full bg-slate-800">
                                <Icon name="satellite" size={18} className={location.lat ? "text-emerald-400" : "text-slate-600"} />
                            </div>
                        </div>
                    </div>

                    {/* Main Compass Area */}
                    <div className="flex-1 flex flex-col items-center justify-center relative px-6">
                        
                        {/* Degrees Display */}
                        <div className="mb-8 text-center animate-custom-pulse">
                            <div className="text-7xl font-black tabular-nums tracking-tighter">
                                {displayDegrees}°
                            </div>
                            <div className="text-2xl font-light text-blue-400 tracking-[0.5em] mt-2 uppercase">
                                {getDirectionLabel(displayDegrees)}
                            </div>
                        </div>

                        {/* Compass Visualizer */}
                        <div className="relative w-64 h-64 md:w-80 md:h-80">
                            <div className="absolute inset-0 rounded-full border border-slate-800 border-dashed opacity-50"></div>
                            
                            <div 
                                className="compass-rose absolute inset-0 flex items-center justify-center"
                                style={{ transform: `rotate(${-azimuth}deg)` }}
                            >
                                <div className="absolute top-4 font-black text-red-500 text-2xl">U</div>
                                <div className="absolute bottom-4 font-bold text-slate-300 text-xl">S</div>
                                <div className="absolute right-4 font-bold text-slate-300 text-xl">T</div>
                                <div className="absolute left-4 font-bold text-slate-300 text-xl">B</div>

                                {[...Array(72)].map((_, i) => (
                                    <div
                                        key={i}
                                        className={`absolute left-1/2 top-0 origin-[0_128px] md:origin-[0_160px] w-0.5 ${i % 9 === 0 ? 'h-6 bg-slate-400' : 'h-3 bg-slate-700/50'}`}
                                        style={{ transform: `rotate(${i * 5}deg)` }}
                                    ></div>
                                ))}
                            </div>

                            <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center">
                                <div className="w-1.5 h-14 bg-red-500 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.8)]"></div>
                            </div>

                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="w-5 h-5 rounded-full bg-blue-500 shadow-[0_0_25px_rgba(59,130,246,0.6)] border-4 border-slate-950 z-30"></div>
                            </div>
                        </div>

                        {/* Info BMKG Cuaca Banner */}
                        <div className="mt-8 w-full max-w-sm">
                            <div className="bg-blue-600/10 border border-blue-500/20 rounded-2xl p-4 flex items-center justify-between mb-4 backdrop-blur-sm">
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-500/20 p-2 rounded-xl text-blue-400">
                                        <Icon name={getWeatherIcon(weather.code)} size={24} />
                                    </div>
                                    <div>
                                        <p className="text-[10px] uppercase font-black text-blue-400 tracking-wider">Info Cuaca BMKG</p>
                                        <p className="text-sm font-bold">{weather.code !== null ? getWeatherDesc(weather.code) : "Mencari data..."}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <p className="text-2xl font-black">{weather.temp !== null ? `${weather.temp}°` : "--"}</p>
                                    <p className="text-[10px] text-slate-500 uppercase">Celsius</p>
                                </div>
                            </div>
                        </div>

                        {/* Data Card */}
                        <div className="w-full max-w-sm bg-slate-900/80 border border-slate-800 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">
                            <div className="grid grid-cols-2 gap-y-6 gap-x-4">
                                <div className="flex items-center gap-3">
                                    <div className="p-2.5 bg-blue-500/10 rounded-xl text-blue-400">
                                        <Icon name="map-pin" size={18} />
                                    </div>
                                    <div>
                                        <p className="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Koordinat</p>
                                        <p className="font-mono text-[10px]">{location.lat ? `${location.lat}, ${location.lon}` : "--.----"}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="p-2.5 bg-purple-500/10 rounded-xl text-purple-400">
                                        <Icon name="mountain" size={18} />
                                    </div>
                                    <div>
                                        <p className="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Altimeter</p>
                                        <p className="font-mono text-sm">{location.alt}m <span className="text-[10px] text-slate-600">dpl</span></p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="p-2.5 bg-amber-500/10 rounded-xl text-amber-400">
                                        <Icon name="wind" size={18} />
                                    </div>
                                    <div>
                                        <p className="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Angin</p>
                                        <p className="font-mono text-xs">
                                            {weather.windSpeed ? `${weather.windSpeed}km/h ${getDirectionLabel(weather.windDir)}` : "--"}
                                        </p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="p-2.5 bg-cyan-500/10 rounded-xl text-cyan-400">
                                        <Icon name="droplets" size={18} />
                                    </div>
                                    <div>
                                        <p className="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Kelembapan</p>
                                        <p className="font-mono text-sm">{weather.humidity !== null ? `${weather.humidity}%` : "--"}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer Controls */}
                    <div className="p-8 flex flex-col gap-4 items-center">
                        {(!hasSensor || !location.lat) && !isSimulating && (
                            <button 
                                onClick={requestPermissions}
                                className="flex items-center gap-3 px-8 py-3.5 font-bold text-white transition-all bg-emerald-600 rounded-full hover:bg-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] active:scale-95"
                            >
                                <Icon name="locate" size={18} />
                                <span className="text-sm uppercase tracking-widest">Sinkronisasi Sensor</span>
                            </button>
                        )}
                        
                        <div className="text-center">
                            <button 
                                onClick={() => {
                                    setIsSimulating(!isSimulating);
                                    if (!isSimulating) setHasSensor(false);
                                }}
                                className="text-slate-500 hover:text-white transition-colors text-[10px] uppercase tracking-widest"
                            >
                                {isSimulating ? "Matikan Simulasi" : "Coba Mode Simulasi"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
